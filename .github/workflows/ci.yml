name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  generator:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.25.0'
      - name: Build pinned benchstat for integration tests
        env:
          GOBIN: ${{ runner.temp }}/benchstat-bin
        run: go install golang.org/x/perf/cmd/benchstat@v0.0.0-20251023143056-3684bd442cc8
      - name: Validate contracts and examples
        env:
          BENCHREPORT_TEST_BENCHSTAT: ${{ runner.temp }}/benchstat-bin/benchstat
        run: go test ./...
      - name: Check Go packages
        run: go vet ./...
      - name: Check normalization CLI against captured inputs
        run: bash tests/normalize-cli.sh
      - name: Check comparison gate and configuration CLI
        env:
          BENCHREPORT_TEST_BENCHSTAT: ${{ runner.temp }}/benchstat-bin/benchstat
        run: bash tests/compare-cli.sh
  publication:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check preparation behavior
        run: bash tests/prepare-comment.sh
      - name: Create sample report
        shell: bash
        run: printf '# Benchmark report\n\nSynthetic summary-only check.\n' > sample-report.md
      - name: Check composite action
        id: report
        uses: ./
        with:
          report-path: sample-report.md
          publish: 'false'
      - name: Check publication status
        shell: bash
        env:
          PUBLICATION: ${{ steps.report.outputs.publication }}
        run: test "$PUBLICATION" = disabled
