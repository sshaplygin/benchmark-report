name: Build reviewed release assets
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  assets:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-14, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.25.0'
      - name: Build licensed native release archive
        run: go run ./cmd/package --release --output-dir "$RUNNER_TEMP/release-assets"
      - name: Verify release license, version, inventory, and checksums
        run: python3 tests/release.py --assets "$RUNNER_TEMP/release-assets"
      - name: Verify installation and reject damaged assets
        run: python3 tests/install.py --assets "$RUNNER_TEMP/release-assets"
      - name: Verify packaged Go and Criterion reports and full replay
        shell: bash
        run: |
          mkdir "$RUNNER_TEMP/release-tools"
          for archive in "$RUNNER_TEMP/release-assets/"*.tar.gz; do
            tar -xzf "$archive" -C "$RUNNER_TEMP/release-tools"
          done
          BENCHREPORT_BINARY="$RUNNER_TEMP/release-tools/benchreport" \
            BENCHREPORT_TEST_BENCHSTAT="$RUNNER_TEMP/release-tools/benchstat" \
            bash tests/report-cli.sh
      - name: Upload archive and checksum for manual release review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/release-assets/*.tar.gz
            ${{ runner.temp }}/release-assets/*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
